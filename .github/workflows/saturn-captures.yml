name: Saturn capture validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  captures:
    name: Saturn capture validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 tools/validate_saturn_captures.py
